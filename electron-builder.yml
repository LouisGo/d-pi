appId: local.d-pi.desktop
productName: d-pi
asar: true
npmRebuild: false
afterPack: ./scripts/packaging/after-pack.mjs
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - THIRD_PARTY_NOTICES.md
  - '!node_modules/**'
extraResources:
  - from: resources/sdk
    to: sdk
    filter:
      - '**/*'
      - '!node_modules{,/**}'
  - from: resources/sdk/node_modules
    to: sdk/node_modules
directories:
  output: dist
mac:
  identity: null
  category: public.app-category.developer-tools
